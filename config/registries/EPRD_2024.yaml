registry: EPRD
country: Germany
report_year: 2024
data_period: "to 2023-12-31"
pdf_glob: "EPRD*AnnualReport2024*.pdf"
notes: >
  The 2024 report (published 2025-03) holds the implant table as Table 52 on two-page spreads.
  In the 2025 report the same table is Table 60 - copy this file to EPRD_2025.yaml and update
  table_id/caption when that PDF is added.

tables:
  - key: knee_femorotibial_combination
    table_id: "52"
    title: Implant outcomes for femoro-tibial combinations in primary knee arthroplasties with or without patellar resurfacing at primary TKA
    procedures:
      UKA:
        sections: ['^Unicondylar knee arthroplast']
      TKA:
        sections: ['^Standard TKAs', '^Constrained TKAs']
    caption: 'Table 52: Implant outcomes'
    caption_position: below       # caption and "(continued)" labels sit under the table
    continuation: 'Table 52 \(continued\)'
    metric:
      type: cumulative_revision_rate
      method: Kaplan-Meier cumulative revision rate (1-KM), percent; number at risk in parentheses
      ci_level: 0.95
      population: "Primary knee arthroplasties by femoro-tibial combination"
    anchor: n_total
    label_hook: eprd_combination
    columns:
      - {name: femoral, header: ["Femoral component"], kind: label, align: left}
      - {name: tibial,  header: ["Tibial component"],  kind: label, align: left}
      - {name: patella, header: ["resur-", "Patellar"], kind: text, align: left}
      - {name: n_total, header: ["Number"], kind: int}
      - {name: hospitals, header: ["Hosp."], kind: int}
      - {name: age,     header: ["Age"],    kind: median_iqr}
      - {name: sex_mf,  header: ["m/f"],    kind: ratio}
      - {name: years_implanted, header: ["Yrs"], kind: text}
      - {name: t1,  header: ["1 year"],   kind: est_ci, time: 1}
      - {name: t2,  header: ["2 years"],  kind: est_ci, time: 2}
      - {name: t3,  header: ["3 years"],  kind: est_ci, time: 3}
      - {name: t4,  header: ["4 years"],  kind: est_ci, time: 4}
      - {name: t5,  header: ["5 years"],  kind: est_ci, time: 5}
      - {name: t6,  header: ["6 years"],  kind: est_ci, time: 6}
      - {name: t7,  header: ["7 years"],  kind: est_ci, time: 7}
      - {name: t8,  header: ["8 years"],  kind: est_ci, time: 8}
      - {name: t9,  header: ["9 years"],  kind: est_ci, time: 9}
    required_columns: [femoral, tibial, n_total, t1, t5]
    x_range: [50, 1190]
    section_patterns:
      - '^(Standard|Constrained) TKAs'
      - '^Unicondylar knee arthroplast'
      - '^Patellofemoral knee arthroplast'
    end_patterns: ['^Table 52', 'EPRD Annual Report 20\d\d']
    footer_margin: 60
    row_types: {}
    expect:
      min_rows: 5
