registry: NJR
document: ankles                     # NJR publishes one PDF per joint
country: England, Wales, Northern Ireland, Isle of Man, Guernsey
report_year: 2025
data_period: "to 2024-12-31"
pdf_glob: "NJR*2025*Ankles*.pdf"

_njr_km: &njr_km
  type: cumulative_revision_km
  method: Kaplan-Meier (1-KM), percent
  ci_level: 0.95
  low_at_risk_rule: "Blue italics: <=250 cases at risk at that time point"
  blank_rule: "Blank: fewer than 10 at risk"

tables:
  - key: ankle_sex_age
    output: casemix
    table_id: "3.A3"
    title: KM estimates of cumulative revision (95% CI) of primary ankle replacement, by sex and age
    procedures:
      ANKLE: {}
    caption: 'Table 3\.A3 KM estimates of cumulative revision'
    metric:
      <<: *njr_km
      population: "All primary ankle replacements ('All cases' row = funnel mean)"
    anchor: n_total
    label_hook: njr_sex_age
    # estimates start left of their headers ('0.73 (0.58-0.91)' under '1 year'): explicit boundaries
    column_bounds: {age: [-1000, 100], n_total: [100, 140], t1: [140, 207], t3: [207, 274], t5: [274, 343],
                    t7: [343, 414], t10: [414, 488], t14: [488, 600]}
    group_pattern: '^(Female|Male)$'
    group_label_column: age
    columns:
      - {name: age,     header: ["(years)"],   kind: label, align: left}
      - {name: n_total, header: ["primaries"], kind: int}
      - {name: t1,  header: ["1 year"],   kind: est_ci, time: 1}
      - {name: t3,  header: ["3 years"],  kind: est_ci, time: 3}
      - {name: t5,  header: ["5 years"],  kind: est_ci, time: 5}
      - {name: t7,  header: ["7 years"],  kind: est_ci, time: 7}
      - {name: t10, header: ["10 years"], kind: est_ci, time: 10}
      - {name: t14, header: ["14 years"], kind: est_ci, time: 14}
    end_patterns: ['^Notes?:']
    expect:
      min_rows: 6                      # 2 sexes x 3 age groups (+ All cases and the 2 sex rows)
      subtotals_check: true

  - key: ankle_brand
    table_id: "3.A4"
    title: KM estimates of cumulative revision (95% CI) of primary ankle replacement, by brand
    procedures:
      ANKLE: {}
    caption: 'Table 3\.A4 KM estimates of cumulative revision'
    text_rotation: 90
    metric:
      <<: *njr_km
      population: "Primary ankle replacement brands with >=250 procedures"
    anchor: n_total
    label_hook: njr_ankle_brand
    column_bounds: {brand: [-1000, 140], n_total: [140, 190], age: [190, 262], male_pct: [262, 290],
                    t1: [290, 370], t3: [370, 443], t5: [443, 511], t7: [511, 590], t10: [590, 672], t14: [672, 800]}
    columns:
      - {name: brand,   header: ["Brand"],     kind: label, align: left}
      - {name: n_total, header: ["primaries"], kind: int}
      - {name: age,     header: ["(IQR)"],     kind: median_iqr}
      - {name: male_pct, header: ["(%)"],      kind: number}
      - {name: t1,  header: ["1 year"],   kind: est_ci, time: 1}
      - {name: t3,  header: ["3 years"],  kind: est_ci, time: 3}
      - {name: t5,  header: ["5 years"],  kind: est_ci, time: 5}
      - {name: t7,  header: ["7 years"],  kind: est_ci, time: 7}
      - {name: t10, header: ["10 years"], kind: est_ci, time: 10}
      - {name: t14, header: ["14 years"], kind: est_ci, time: 14}
    end_patterns: ['^Notes?:']
    expect:
      min_rows: 9
