registry: NJR
document: elbows
country: England, Wales, Northern Ireland, Isle of Man, Guernsey
report_year: 2025
data_period: "to 2024-12-31"
pdf_glob: "NJR*2025*Elbows*.pdf"
notes: >
  Funnel scope is TOTAL ELBOW replacement (decision 2026-10). The funnel mean is the n-weighted pool of the
  two 3.E6 'Total elbow replacement' rows (acute trauma + elective), matching the 3.E8 total-elbow brand rows,
  which include both indications. Radial head, distal humeral hemi and 'unconfirmed' rows are extracted too.

_njr_km: &njr_km
  type: cumulative_revision_km
  method: Kaplan-Meier (1-KM), percent
  ci_level: 0.95
  low_at_risk_rule: "Blue italics: <=250 cases at risk at that time point"
  blank_rule: "Blank: fewer than 10 at risk"

tables:
  - key: elbow_indication_type
    output: casemix
    table_id: "3.E6"
    title: KM estimates of cumulative revision (95% CI) by primary elbow procedure, for acute trauma and elective cases
    procedures:
      ELBOW: {}
    caption: 'Table 3\.E6 E6 KM estimates of cumulative revision'
    continuation: 'Table 3\.E6 \(continued\)'
    stop_caption: 'Table 3\.E7'
    metric:
      <<: *njr_km
      population: "All primary elbow procedures, by indication (acute trauma / elective) and procedure type"
    anchor: n_total
    label_hook: njr_elbow_indication
    fixed_columns: {label: [50, 145]}          # the row labels have no column header
    group_pattern: '^All (acute trauma|elective) cases$'
    group_label_column: label
    columns:
      - {name: label,   header: ["__no_header__"], kind: label, align: left}
      - {name: n_total, header: ["primaries"], kind: int}
      - {name: age,     header: ["(IQR)"],     kind: median_iqr}
      - {name: male_pct, header: ["(%)"],      kind: number}
      - {name: t1,  header: ["1 year"],   kind: est_ci, time: 1}
      - {name: t3,  header: ["3 years"],  kind: est_ci, time: 3}
      - {name: t5,  header: ["5 years"],  kind: est_ci, time: 5}
      - {name: t7,  header: ["7 years"],  kind: est_ci, time: 7}
      - {name: t10, header: ["10 years"], kind: est_ci, time: 10}
      - {name: t11, header: ["11 years"], kind: est_ci, time: 11}
    anchor_pattern: '^(<4|[\d,]+)$'
    end_patterns: ['^Notes?:']
    expect:
      min_rows: 15

  - key: elbow_brand
    table_id: "3.E8"
    title: KM estimates of cumulative revision (95% CI) for all primary elbow procedures by implant brand
    procedures:
      ELBOW: {}
    caption: 'Table 3\.E8 KM estimates of cumulative revision'
    text_rotation: 90
    metric:
      <<: *njr_km
      population: "Primary elbow brands with >=100 procedures; all indications"
    anchor: n_total
    label_hook: njr_elbow_brand
    fixed_columns: {group: [50, 127], subgroup: [127, 175], brand: [175, 285]}   # drawn group cells, no headers
    span_columns: [group, subgroup]                          # one label per drawn cell, spanning its rows
    columns:
      - {name: group,    header: ["__no_header__"], kind: label, align: left}
      - {name: subgroup, header: ["__no_header__"], kind: label, align: left}
      - {name: brand,    header: ["__no_header__"], kind: label, align: left}
      - {name: n_total, header: ["primaries"], kind: int}
      - {name: age,     header: ["(IQR)"],     kind: median_iqr}
      - {name: male_pct, header: ["(%)"],      kind: number}
      - {name: t1,  header: ["1 year"],   kind: est_ci, time: 1}
      - {name: t3,  header: ["3 years"],  kind: est_ci, time: 3}
      - {name: t5,  header: ["5 years"],  kind: est_ci, time: 5}
      - {name: t7,  header: ["7 years"],  kind: est_ci, time: 7}
      - {name: t10, header: ["10 years"], kind: est_ci, time: 10}
      - {name: t11, header: ["11 years"], kind: est_ci, time: 11}
    end_patterns: ['^Notes?:']
    expect:
      min_rows: 10
